<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日面试题 · Interview Daily</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 5rem;
      line-height: 1.6;
    }

    .container { max-width: 860px; margin: 0 auto; }

    /* Header */
    header { text-align: center; padding: 2rem 0 2.5rem; }
    .badge {
      display: inline-block;
      background: #388bfd1a;
      border: 1px solid #388bfd55;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #e6edf3 0%, #58a6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    header p { color: var(--muted); font-size: 0.95rem; }

    /* Loading */
    #loading {
      text-align: center;
      padding: 4rem 0;
      color: var(--muted);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Main card */
    #main-content { display: none; }

    .meta-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .tag {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid;
    }
    .tag-role   { color: var(--accent);  border-color: #388bfd55; background: #388bfd11; }
    .tag-type   { color: var(--purple);  border-color: #bc8cff55; background: #bc8cff11; }
    .tag-easy   { color: var(--green);   border-color: #3fb95055; background: #3fb95011; }
    .tag-medium { color: var(--yellow);  border-color: #d2992255; background: #d2992211; }
    .tag-hard   { color: var(--red);     border-color: #f8514955; background: #f8514911; }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .action-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #30363d; }
    .btn-primary {
      background: #1f6feb;
      border-color: #388bfd66;
      color: #fff;
    }
    .btn-primary:hover { background: #388bfd; }

    /* Breakdown sections */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 1.5rem;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.15s;
    }
    .section-header:hover { background: var(--surface2); }
    .section-header.open { border-bottom-color: var(--border); }
    .section-icon { font-size: 1.1rem; }
    .section-title { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .section-arrow { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
    .section-header.open .section-arrow { transform: rotate(90deg); }
    .section-body {
      display: none;
      padding: 1.25rem 1.5rem;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .section-body.open { display: block; }

    /* Followup chips */
    .followup-list { list-style: none; }
    .followup-list li {
      padding: 0.6rem 0.9rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .followup-list li::before { content: "↳ "; color: var(--muted); }

    /* History */
    .history-section { margin-top: 2.5rem; }
    .history-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .history-list { list-style: none; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-date { color: var(--muted); min-width: 90px; font-family: monospace; }
    .history-role { min-width: 100px; }
    .history-q { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Date display */
    .date-display { color: var(--muted); font-size: 0.82rem; margin-left: auto; }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">每日更新</div>
    <h1>每日面试题</h1>
    <p>精选热门技术岗位面试题，附完整拆解 · 每天 08:00 更新</p>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    <p>加载今日题目中…</p>
  </div>

  <div id="main-content">
    <div class="meta-bar">
      <span class="tag tag-role" id="tag-role"></span>
      <span class="tag tag-type" id="tag-type"></span>
      <span class="tag" id="tag-diff"></span>
      <span class="date-display" id="date-display"></span>
    </div>

    <div class="question-card">
      <div class="question-text" id="question-text"></div>
      <div class="action-row">
        <a class="btn btn-primary" id="practice-btn" href="#" target="_blank">🎯 去练习</a>
        <button class="btn" onclick="toggleAll()">📖 展开全部</button>
      </div>
    </div>

    <!-- 拆解卡片 -->
    <div class="section" id="sec-focus">
      <div class="section-header" onclick="toggleSection('focus')">
        <span class="section-icon">🎯</span>
        <span class="section-title">考察点</span>
        <span class="section-arrow">▶</span>
      </div>
      <div class="section-body" id="body-focus"></div>
    </div>

    <div class="section" id="sec-framework">
      <div class="section-header" onclick="toggleSection('framework')">
        <span class="section-icon">🗂️</span>
        <span class="section-title">答题框架</span>
        <span class="section-arrow">▶</span>
      </div>
      <div class="section-body" id="body-framework"></div>
    </div>

    <div class="section" id="sec-example">
      <div class="section-header" onclick="toggleSection('example')">
        <span class="section-icon">✅</span>
        <span class="section-title">高分答案示例</span>
        <span class="section-arrow">▶</span>
      </div>
      <div class="section-body" id="body-example"></div>
    </div>

    <div class="section" id="sec-pitfalls">
      <div class="section-header" onclick="toggleSection('pitfalls')">
        <span class="section-icon">⚠️</span>
        <span class="section-title">常见误区</span>
        <span class="section-arrow">▶</span>
      </div>
      <div class="section-body" id="body-pitfalls"></div>
    </div>

    <div class="section" id="sec-followup">
      <div class="section-header" onclick="toggleSection('followup')">
        <span class="section-icon">💬</span>
        <span class="section-title">追问方向</span>
        <span class="section-arrow">▶</span>
      </div>
      <div class="section-body" id="body-followup"></div>
    </div>

    <!-- 历史记录 -->
    <div class="history-section">
      <div class="history-title">历史题目</div>
      <ul class="history-list" id="history-list">
        <li style="color:var(--muted); font-size:0.875rem;">加载中…</li>
      </ul>
    </div>
  </div>

  <footer>
    <p>由 <a href="https://jason1105.github.io/dev-hub" target="_blank">Jason's Dev Hub</a> 出品 · 每天精进一点点</p>
  </footer>
</div>

<script>
  let allOpen = false;
  const sections = ['focus', 'framework', 'example', 'pitfalls', 'followup'];

  function toggleSection(id) {
    const header = document.querySelector(`#sec-${id} .section-header`);
    const body = document.getElementById(`body-${id}`);
    const isOpen = body.classList.contains('open');
    header.classList.toggle('open', !isOpen);
    body.classList.toggle('open', !isOpen);
  }

  function toggleAll() {
    allOpen = !allOpen;
    sections.forEach(id => {
      const header = document.querySelector(`#sec-${id} .section-header`);
      const body = document.getElementById(`body-${id}`);
      header.classList.toggle('open', allOpen);
      body.classList.toggle('open', allOpen);
    });
  }

  function diffClass(diff) {
    if (diff === '简单') return 'tag-easy';
    if (diff === '困难') return 'tag-hard';
    return 'tag-medium';
  }

  async function load() {
    try {
      const res = await fetch(`questions/latest.json?t=${Date.now()}`);
      const d = await res.json();

      document.getElementById('tag-role').textContent = '💼 ' + d.role;
      document.getElementById('tag-type').textContent = d.type || '';
      const diffEl = document.getElementById('tag-diff');
      diffEl.textContent = d.difficulty || '';
      diffEl.className = 'tag ' + diffClass(d.difficulty);
      document.getElementById('date-display').textContent = d.date;
      document.getElementById('question-text').textContent = d.question;
      document.getElementById('practice-btn').href = d.practice_url || '#';

      const b = d.breakdown || {};
      document.getElementById('body-focus').textContent = b.focus || '';
      document.getElementById('body-framework').textContent = b.framework || '';
      document.getElementById('body-example').textContent = b.example || '';
      document.getElementById('body-pitfalls').textContent = b.pitfalls || '';

      // 追问方向特殊处理
      const fu = b.followup || '';
      const fuLines = fu.split(/\n|？|?/).map(s => s.trim()).filter(s => s.length > 4);
      if (fuLines.length > 0) {
        const ul = document.createElement('ul');
        ul.className = 'followup-list';
        fuLines.forEach(line => {
          const li = document.createElement('li');
          li.textContent = line.replace(/^\d+\.\s*/, '');
          ul.appendChild(li);
        });
        document.getElementById('body-followup').innerHTML = '';
        document.getElementById('body-followup').appendChild(ul);
      } else {
        document.getElementById('body-followup').textContent = fu;
      }

      // 默认展开考察点
      toggleSection('focus');

      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';

      loadHistory();
    } catch (e) {
      document.getElementById('loading').innerHTML = `<p style="color:var(--red)">加载失败：${e.message}</p>`;
    }
  }

  async function loadHistory() {
    try {
      const res = await fetch(`questions/index.json?t=${Date.now()}`);
      const index = await res.json();
      const ul = document.getElementById('history-list');
      ul.innerHTML = '';
      index.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="history-date">${item.date}</span>
          <span class="history-role">${item.role}</span>
          <span class="history-q">${item.question}</span>
        `;
        ul.appendChild(li);
      });
    } catch {}
  }

  load();
</script>
</body>
</html>
